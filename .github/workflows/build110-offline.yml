name: BUILD110 offline and ARM32 QEMU

on:
  push:
    branches: [feature/build110-first-hardware-boot]
    paths: ['porting/build110/**', '.github/workflows/build110-offline.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/feature/build110-first-hardware-boot'
    runs-on: [self-hosted, debian]
    timeout-minutes: 5
    env:
      INPUT_ARCHIVE: ${{ vars.BUILD110_BUILD109_ARCHIVE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build twice, compare, and boot on QEMU virt
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = debian
          if [[ "$INPUT_ARCHIVE" != /* || ! -r "$INPUT_ARCHIVE" ]]; then
            echo "::error::Set BUILD110_BUILD109_ARCHIVE to the absolute path of the pinned BUILD109 ZIP on debian."
            exit 1
          fi
          work=$(mktemp -d "$RUNNER_TEMP/build110.XXXXXX")
          trap 'rm -rf -- "$work"' EXIT
          mkdir -p "$work"/{a,b} build110-results
          cp -- "$INPUT_ARCHIVE" "$work/input.zip"
          name=BUILD110-Q60T-OFFLINE-ONLY.zip
          for dir in a b; do
            python3 porting/build110/build110.py build "$work/input.zip" "$work/$dir/$name"
            (cd "$work/$dir" && sha256sum -c "$name.sha256")
          done
          cmp "$work/a/$name" "$work/b/$name"
          python3 porting/build110/build110.py qemu "$work/input.zip" "$work/a/$name" |
            tee build110-results/qemu.txt
          cp "$work/a/$name" "$work/a/$name.sha256" build110-results/
      - uses: actions/upload-artifact@v4
        with:
          name: build110-offline-and-qemu
          path: build110-results/
          if-no-files-found: error
