name: Build070 Q60T drivers on 6.6.162 ARM32 (self-hosted)

# Build 070: sources for the driver port (firmware dtb.bin, Samsung GPL
# package), source excerpts for the port, and the shared Q60T kernel build
# (Build-059 profile "android" + nikel-drivers.config + patch 0012).
# Read-only / compile-only: no TV, no flashing, no module loading.
#
# Trigger: push of porting/build070/runner/request.env on a claude/build070-*
# branch (or workflow_dispatch once on the default branch).
on:
  push:
    branches: ['claude/build070-*']
    paths: ['porting/build070/runner/request.env']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build068-selfhosted-v2   # one runner, shared with Build 068/069
  cancel-in-progress: false

env:
  FULLOS_URL: https://noverhost.de/Samsung-Q60T-Tizen-2743-FullOS.zip
  GPL_URL: https://noverhost.de/20_DTV_NikeL.zip

jobs:
  offline-tests:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          for s in porting/build070/kernel_build.sh porting/build070/tools/gpl_inventory.sh \
                   porting/build059/kernel/build.sh; do bash -n "$s"; done
          python3 -m unittest discover -s porting/build059/tests -v
          python3 -m unittest discover -s porting/build070/tests -v

  run:
    needs: offline-tests
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 240
    env:
      WORK_DIR: ${{ github.workspace }}/../build070-run
    steps:
      - uses: actions/checkout@v4

      - name: Parse and validate request.env
        shell: bash
        run: |
          set -euo pipefail
          f=porting/build070/runner/request.env
          get() { sed -n "s/^$1=//p" "$f" | tail -1; }
          MODE="$(get MODE)"; LOS_DIR="$(get LOS_DIR)"; GPL_DIR="$(get GPL_DIR)"
          SHOW_PATHS="$(get SHOW_PATHS)"; SHOW_LINES="$(get SHOW_LINES)"
          case "$MODE" in sources|show|kernel) ;; *) echo "bad MODE"; exit 1 ;; esac
          for d in "$LOS_DIR" "$GPL_DIR"; do
            [[ "$d" =~ ^/[A-Za-z0-9._/-]+$ && "$d" != *..* ]] || { echo "bad dir $d"; exit 1; }
          done
          [[ "$SHOW_LINES" =~ ^[0-9]+-[0-9]+$ ]] || { echo "bad SHOW_LINES"; exit 1; }
          n=0
          for p in $SHOW_PATHS; do
            [[ "$p" =~ ^(src|firmware)/[A-Za-z0-9._/,+-]+$ && "$p" != *..* ]] || { echo "bad path $p"; exit 1; }
            n=$((n + 1))
          done
          [ "$n" -le 12 ] || { echo "too many SHOW_PATHS"; exit 1; }
          {
            echo "MODE=$MODE"; echo "LOS_DIR=$LOS_DIR"; echo "GPL_DIR=$GPL_DIR"
            echo "SHOW_PATHS=$SHOW_PATHS"; echo "SHOW_LINES=$SHOW_LINES"
            echo "WORK_DIR=$(realpath -m "$WORK_DIR")"
          } | tee -a "$GITHUB_ENV"

      - name: Firmware DTBs (range request, SHA-256 vs Build 004)
        if: env.MODE == 'sources'
        shell: bash
        run: |
          set -euo pipefail
          fw="$GPL_DIR/firmware"
          python3 -I porting/build070/tools/fetch_sources.py dtb "$FULLOS_URL" "$fw"
          t=porting/build070/tools/dt_nodes.py
          echo "===== node table dtb0 (T> lines)"
          python3 -I "$t" table "$fw/dtb0.dtb" | sed 's/^/T> /'
          echo "===== driver nodes dtb0, all properties (N> lines)"
          python3 -I "$t" detail "$fw/dtb0.dtb" | sed 's/^/N> /'
          echo "===== dtb0 vs dtb1 differences (X> lines)"
          python3 -I "$t" diff "$fw/dtb0.dtb" "$fw/dtb1.dtb" | sed 's/^/X> /' | head -400

      - name: Samsung GPL package (download once, unpack, inventory)
        if: env.MODE == 'sources'
        shell: bash
        run: |
          set -euo pipefail
          python3 -I porting/build070/tools/fetch_sources.py gpl "$GPL_URL" "$GPL_DIR"
          echo "===== inner ZIP listing"
          sed 's/^/I> /' "$GPL_DIR/gpl-inner-listing.txt"
          bash porting/build070/tools/gpl_inventory.sh "$GPL_DIR"

      - name: Source excerpts for the port (S> lines)
        if: env.MODE == 'show'
        shell: bash
        run: |
          set -uo pipefail
          a="${SHOW_LINES%-*}"; b="${SHOW_LINES#*-}"
          for p in $SHOW_PATHS; do
            f="$GPL_DIR/$p"
            if [ -d "$f" ]; then
              echo "===== $p (directory)"; find "$f" -maxdepth 2 | sed "s|^$GPL_DIR/|S> |" | head -300
            elif [ -f "$f" ]; then
              echo "===== $p lines $a-$b of $(wc -l < "$f")"
              sed -n "${a},${b}p" "$f" | nl -ba -v "$a" | sed 's/^/S> /'
            else
              echo "===== $p: not found"
            fi
          done

      - name: Shared Q60T kernel (android profile, W=1 -Werror, dtc W=1)
        if: env.MODE == 'kernel'
        shell: bash
        run: bash porting/build070/kernel_build.sh "$WORK_DIR" "$LOS_DIR"

      - name: Kernel build log tail
        if: always() && env.MODE == 'kernel'
        shell: bash
        run: |
          [ -f "$WORK_DIR/kernel-build.log" ] && tail -n 80 "$WORK_DIR/kernel-build.log" | cut -c1-300
          true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build070-${{ env.MODE }}-${{ github.run_id }}
          path: |
            ${{ env.GPL_DIR }}/firmware/dtb-manifest.json
            ${{ env.GPL_DIR }}/firmware/dtb0.dts
            ${{ env.GPL_DIR }}/firmware/dtb1.dts
            ${{ env.GPL_DIR }}/gpl-manifest.json
            ${{ env.WORK_DIR }}/summary.txt
            ${{ env.WORK_DIR }}/kernel/artifacts-arm-android/config
            ${{ env.WORK_DIR }}/kernel/artifacts-arm-android/android-coverage.txt
            ${{ env.WORK_DIR }}/kernel/artifacts-arm-android/BUILD_INFO.txt
          if-no-files-found: warn
          retention-days: 30
