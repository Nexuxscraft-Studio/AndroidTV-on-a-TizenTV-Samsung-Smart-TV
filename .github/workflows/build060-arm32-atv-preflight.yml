name: Build060 Android 15 ARM32 ATV preflight

# Offline unit and syntax tests only; no full Android build or TV access.
on:
  push:
    paths:
      - 'porting/build060/**'
      - '.github/workflows/build060-arm32-atv-preflight.yml'
  pull_request:
    paths:
      - 'porting/build060/**'
      - '.github/workflows/build060-arm32-atv-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm32-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unit-test ARM32 ATV configuration, build and driver checks
        run: python3 -m unittest discover -s porting/build060/tests -v
      - name: Syntax-check Build060 Python
        run: python3 -m compileall -q porting/build060
      - name: Emit source-only driver inventory
        run: python3 porting/build060/driver_audit.py --repo .
