name: BUILD 123 SERET slot evidence
on:
  push:
    branches: ["build123/seret-slot-fallback-analysis"]
    paths:
      - .github/workflows/build123-seret-slot.yml
      - scripts/build123_seret_evidence.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    if: github.repository == 'Nexuxscraft-Studio/AndroidTV-on-a-TizenTV-Samsung-Smart-TV' && github.ref == 'refs/heads/build123/seret-slot-fallback-analysis'
    runs-on: [self-hosted, debian]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read extracted firmware
        run: python3 scripts/build123_seret_evidence.py "$RUNNER_TEMP/build123-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build123-seret-slot-evidence
          path: ${{ runner.temp }}/build123-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 7
