name: Build 059 display probe
on:
  pull_request:
    paths:
      - 'porting/build059/**'
      - '.github/workflows/build059-display-probe.yml'
permissions:
  contents: read
jobs:
  arm32:
    runs-on: [self-hosted, Linux, X64, androidtv, arm32]
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf device-tree-compiler flex bison libssl-dev libelf-dev bc
      - name: Verify and unpack Linux 6.6.162
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 -O https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.162.tar.xz
          echo '4aa89f3652fc131e5d39990f3bcd4b9e131028af3f315dbe83f3a8557dc06f06  linux-6.6.162.tar.xz' | sha256sum -c -
          tar -xf linux-6.6.162.tar.xz
      - name: Check disabled DT and compile ARM32 probe
        env:
          CROSS_COMPILE: arm-linux-gnueabihf-
        run: |
          bash porting/build059/run-arm32-compile-only.sh "$RUNNER_TEMP/linux-6.6.162" "$RUNNER_TEMP/build059"
