name: Build059 Nike-L kernel (Linux 6.6.162, arm64 + arm32)

# Builds the Build 059 base kernel for the Samsung Q60T (Nike-L SoC):
# Linux 6.6.162 + porting/build059/kernel/patches, for arm64 and arm32,
# in a small ("tiny"), a distribution-like ("full") and an Android 15
# ("android", + AOSP android-base.config, with coverage report) configuration.
#
# A green run proves: the patches apply, the configuration contains every
# required symbol, the new UART driver builds warning-free with W=1, and a
# kernel image plus the Q60T device trees are produced.
# It does NOT prove that anything boots on the television.

on:
  push:
    paths:
      - 'porting/build059/**'
      - 'porting/ci/**'
      - '.github/workflows/build059-nikel-kernel.yml'
  pull_request:
    paths:
      - 'porting/build059/**'
      - 'porting/ci/**'
      - '.github/workflows/build059-nikel-kernel.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  LINUX_TAG: v6.6.162
  # Commit the v6.6.162 stable tag points to; the clone is rejected otherwise.
  LINUX_COMMIT: 5139929c698c273e07cb0635732f6a918a7b8e78

jobs:
  host-tests:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests for Build 059 tools
        run: python3 -m unittest discover -s porting/build059/tests -v

  kernel:
    needs: host-tests
    runs-on: [self-hosted, Linux, X64]
    # tiny normally needs ~7 min, full/android ~45 min; a stalled runner
    # (seen on 2026-11-10: compile stopped, no output for an hour) aborts early
    timeout-minutes: ${{ matrix.profile == 'tiny' && 30 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, arm]
        profile: [tiny, full, android]
    steps:
      - uses: actions/checkout@v4

      - name: Use self-hosted build tools
        run: |
          source porting/ci/selfhosted-llvm.sh

      - name: Fetch pinned Linux 6.6.162
        run: |
          git clone --depth 1 --branch "$LINUX_TAG" \
            https://github.com/gregkh/linux.git "$RUNNER_TEMP/linux"
          actual="$(git -C "$RUNNER_TEMP/linux" rev-parse HEAD)"
          echo "Linux commit: $actual"
          test "$actual" = "$LINUX_COMMIT"

      # Official Android 15 (V) kernel config requirements for 6.6, fetched
      # from AOSP at build time. The digest is printed for traceability.
      - name: Fetch AOSP android-6.6 android-base.config
        if: matrix.profile == 'android'
        run: |
          out="$RUNNER_TEMP/android-base.config"
          for p in v/android-6.6 android-6.6; do
            url="https://android.googlesource.com/kernel/configs/+/refs/heads/main/$p/android-base.config?format=TEXT"
            if curl -fsSL "$url" | base64 -d > "$out" 2>/dev/null && grep -q '^CONFIG_' "$out"; then
              echo "source: $url"
              break
            fi
            rm -f "$out"
          done
          test -s "$out"
          sha256sum "$out"
          wc -l "$out"
          echo "ANDROID_BASE_CONFIG=$out" >> "$GITHUB_ENV"

      - name: Build kernel and device trees
        env:
          TOOLCHAIN: llvm
          JOBS: 4
        run: |
          bash porting/build059/kernel/build.sh "$RUNNER_TEMP/linux" \
            "${{ matrix.arch }}" "${{ matrix.profile }}" "$RUNNER_TEMP/out" \
            2>&1 | tee "$RUNNER_TEMP/build.log"
          test "${PIPESTATUS[0]}" = 0

      - name: Collect log
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out/artifacts-${{ matrix.arch }}-${{ matrix.profile }}"
          cp "$RUNNER_TEMP/build.log" \
            "$RUNNER_TEMP/out/artifacts-${{ matrix.arch }}-${{ matrix.profile }}/" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build059-${{ matrix.arch }}-${{ matrix.profile }}
          path: ${{ runner.temp }}/out/artifacts-${{ matrix.arch }}-${{ matrix.profile }}
          retention-days: 30
