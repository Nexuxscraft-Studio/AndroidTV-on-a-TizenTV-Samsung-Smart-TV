name: Build058 ARM32 compile gate (repository sources only)

# Compile-only gate for the repository-owned Build 058 kernel sources and the
# upstream Panfrost driver against a pinned Linux 6.6.162 tree (ARCH=arm).
#
# What a green run proves: these C sources compile to ELF32/ARM objects with
# the named toolchain and kernel. What it does NOT prove: Samsung DRM Core/GEM
# (the Samsung archive is never used here), module linking (modpost needs a
# full kernel build), booting, clocks, display, or anything on the Q60T.

on:
  push:
    paths:
      - 'porting/build058/**'
      - '.github/workflows/build058-arm32-compile.yml'
  pull_request:
    paths:
      - 'porting/build058/**'
      - '.github/workflows/build058-arm32-compile.yml'
  workflow_dispatch:
    inputs:
      full_kernel:
        description: 'Also build vmlinux + modules and run modpost (slow, 1-3 h)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  LINUX_TAG: v6.6.162
  # Commit the v6.6.162 stable tag points to; the clone is rejected otherwise.
  LINUX_COMMIT: 5139929c698c273e07cb0635732f6a918a7b8e78

jobs:
  arm32-objects:
    runs-on: ubuntu-24.04
    # Object-only runs take minutes; the limit covers the optional full build.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # gcc matches the Debian lab (arm-linux-gnueabihf-); llvm is an
        # independent second compiler, not a substitute for the GCC result.
        toolchain: [gcc, llvm]
    steps:
      - uses: actions/checkout@v4

      # The runner context is not available in job-level env; derive paths here.
      - name: Set work paths
        run: |
          echo "OUT=$RUNNER_TEMP/build058-ci-${{ matrix.toolchain }}" >> "$GITHUB_ENV"
          echo "KSRC=$RUNNER_TEMP/linux-6.6.162" >> "$GITHUB_ENV"

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf \
            clang lld llvm flex bison bc libssl-dev libelf-dev make patch

      - name: Fetch pinned Linux 6.6.162
        run: |
          git clone --depth 1 --branch "$LINUX_TAG" \
            https://github.com/gregkh/linux.git "$KSRC"
          actual="$(git -C "$KSRC" rev-parse HEAD)"
          echo "Linux commit: $actual"
          test "$actual" = "$LINUX_COMMIT"

      - name: Compile ARM32 objects (no Samsung archive, no hardware)
        env:
          BUILD058_TOOLCHAIN: ${{ matrix.toolchain }}
          CROSS_COMPILE: arm-linux-gnueabihf-
          JOBS: 4
          BUILD058_FULL_KERNEL: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_kernel) && '1' || '0' }}
        run: |
          bash porting/build058/integration/run-arm32-compile-only.sh \
            "$KSRC" --no-vendor-drm "$OUT"

      - name: Show results
        if: always()
        run: |
          cat "$OUT/inputs.txt" || true
          cat "$OUT/RESULTS.tsv" || true

      - name: Upload results and compiler logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build058-arm32-${{ matrix.toolchain }}
          path: |
            ${{ env.OUT }}/RESULTS.tsv
            ${{ env.OUT }}/inputs.txt
            ${{ env.OUT }}/logs/
          if-no-files-found: warn
          retention-days: 14
